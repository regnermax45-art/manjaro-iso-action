# MaxregnerOS Gesture Configuration
# Comprehensive touch and gesture support for mobile-like interaction

[Global_Settings]
# Global gesture configuration
gesture_engine = "touchegg"
sensitivity = "medium"
animation_speed = "fast"
haptic_feedback = true
visual_feedback = true
gesture_timeout = 500
minimum_distance = 50
maximum_distance = 1000

[Three_Finger_Gestures]
# Three-finger gestures for workspace and window management
swipe_up = "show_desktop"
swipe_down = "show_desktop"
swipe_left = "next_workspace"
swipe_right = "previous_workspace"
tap = "middle_click"
pinch_in = "minimize_window"
pinch_out = "maximize_window"

[Four_Finger_Gestures]
# Four-finger gestures for advanced navigation
swipe_up = "show_activities"
swipe_down = "show_applications"
swipe_left = "switch_application_next"
swipe_right = "switch_application_previous"
tap = "show_context_menu"
pinch_in = "show_desktop"
pinch_out = "show_overview"

[Two_Finger_Gestures]
# Two-finger gestures for basic navigation
scroll_up = "scroll_up"
scroll_down = "scroll_down"
scroll_left = "scroll_left"
scroll_right = "scroll_right"
pinch_in = "zoom_out"
pinch_out = "zoom_in"
tap = "right_click"
double_tap = "smart_zoom"

[Edge_Gestures]
# Edge swipe gestures for mobile-like navigation
left_edge_swipe_right = "back"
right_edge_swipe_left = "forward"
top_edge_swipe_down = "show_notifications"
bottom_edge_swipe_up = "show_dock"

# Corner gestures
top_left_corner = "show_activities"
top_right_corner = "show_notifications"
bottom_left_corner = "show_applications"
bottom_right_corner = "show_desktop"

[Application_Specific]
# Application-specific gesture overrides

[Application_Specific.Firefox]
two_finger_swipe_left = "browser_back"
two_finger_swipe_right = "browser_forward"
three_finger_swipe_up = "new_tab"
three_finger_swipe_down = "close_tab"
pinch_in = "zoom_out"
pinch_out = "zoom_in"

[Application_Specific.Nautilus]
two_finger_swipe_left = "navigate_back"
two_finger_swipe_right = "navigate_forward"
three_finger_swipe_up = "parent_directory"
three_finger_swipe_down = "show_hidden_files"
pinch_in = "icon_view"
pinch_out = "list_view"

[Application_Specific.Terminal]
two_finger_swipe_up = "scroll_up"
two_finger_swipe_down = "scroll_down"
three_finger_swipe_left = "previous_tab"
three_finger_swipe_right = "next_tab"
three_finger_tap = "paste"

[Touch_Zones]
# Define touch-sensitive zones on screen
hot_corners = true
edge_sensitivity = 20
corner_size = 50
gesture_area_margin = 10

# Screen zones (in pixels from edge)
left_edge_zone = 20
right_edge_zone = 20
top_edge_zone = 20
bottom_edge_zone = 20

[Gesture_Feedback]
# Visual and haptic feedback settings
show_gesture_trails = true
trail_color = "rgba(33, 150, 243, 0.6)"
trail_width = 3
trail_duration = 300

# Haptic feedback patterns
light_tap = "short"
medium_tap = "medium"
strong_tap = "long"
success_pattern = "double_short"
error_pattern = "long_short_long"

[Advanced_Gestures]
# Advanced multi-touch gestures
five_finger_pinch = "show_desktop"
five_finger_spread = "show_all_windows"
palm_rejection = true
accidental_touch_prevention = true

# Gesture combinations
ctrl_two_finger_scroll = "horizontal_scroll"
shift_two_finger_scroll = "fast_scroll"
alt_three_finger_swipe = "window_switching"

[Accessibility]
# Accessibility features for gestures
gesture_assist = true
slow_gestures = false
gesture_confirmation = false
voice_feedback = false
large_gesture_targets = true

# Gesture alternatives for accessibility
tap_to_click = true
drag_lock = false
sticky_gestures = false
gesture_timeout_extended = false

[Performance]
# Performance optimization settings
gesture_prediction = true
smooth_tracking = true
low_latency_mode = true
battery_optimization = false
cpu_throttling = false

# Gesture processing
max_simultaneous_gestures = 10
gesture_buffer_size = 100
processing_interval = 16 # 60fps

[Calibration]
# Touch calibration settings
touch_pressure_threshold = 50
minimum_touch_size = 10
maximum_touch_size = 100
touch_jitter_filter = true
palm_size_threshold = 200

# Gesture recognition thresholds
swipe_velocity_threshold = 500
pinch_scale_threshold = 0.1
rotation_angle_threshold = 15
tap_time_threshold = 200
double_tap_interval = 300

[Debug]
# Debug and development settings
debug_mode = false
show_touch_points = false
log_gestures = false
gesture_overlay = false
performance_monitoring = false
