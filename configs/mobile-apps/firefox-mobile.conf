# Firefox Mobile-Optimized Configuration for MaxregnerOS
# Optimizes Firefox for touch interfaces and mobile-like experience

[General]
# Mobile-first browser configuration
user_pref("browser.tabs.drawInTitlebar", true);
user_pref("browser.tabs.inTitlebar", 1);
user_pref("browser.uidensity", 1); // Touch-friendly UI density

# Touch interface optimizations
user_pref("dom.w3c_touch_events.enabled", 1);
user_pref("apz.allow_zooming", true);
user_pref("apz.gtk.kinetic_scroll.enabled", true);
user_pref("apz.gtk.touchpad_pinch.enabled", true);
user_pref("apz.overscroll.enabled", true);
user_pref("apz.overscroll.horizontal.enabled", true);

# Mobile gesture support
user_pref("browser.gesture.swipe.left", "Browser:BackOrBackDuplicate");
user_pref("browser.gesture.swipe.right", "Browser:ForwardOrForwardDuplicate");
user_pref("browser.gesture.pinch.latched", true);
user_pref("browser.gesture.pinch.threshold", 25);

# Mobile-friendly scrolling
user_pref("mousewheel.default.delta_multiplier_y", 300);
user_pref("mousewheel.min_line_scroll_amount", 5);
user_pref("general.smoothScroll", true);
user_pref("general.smoothScroll.lines", true);
user_pref("general.smoothScroll.pages", true);
user_pref("general.smoothScroll.scrollbars", true);

# Touch-optimized interface
user_pref("browser.tabs.tabMinWidth", 100); // Wider tabs for touch
user_pref("browser.urlbar.clickSelectsAll", true);
user_pref("browser.urlbar.doubleClickSelectsAll", true);
user_pref("browser.tabs.closeButtons", 1); // Always show close buttons

# Mobile-style navigation
user_pref("browser.backspace_action", 0); // Backspace goes back
user_pref("browser.tabs.loadBookmarksInTabs", true);
user_pref("browser.search.openintab", true);

# Performance optimizations for mobile
user_pref("layers.acceleration.force-enabled", true);
user_pref("layers.offmainthreadcomposition.enabled", true);
user_pref("webgl.force-enabled", true);
user_pref("gfx.webrender.all", true);

# Mobile-friendly zoom
user_pref("zoom.minPercent", 50);
user_pref("zoom.maxPercent", 500);
user_pref("toolkit.zoomManager.zoomValues", "0.5,0.67,0.8,0.9,1,1.1,1.2,1.33,1.5,1.7,2,2.4,3,4,5");

# Privacy and security for mobile
user_pref("privacy.trackingprotection.enabled", true);
user_pref("privacy.donottrackheader.enabled", true);
user_pref("geo.enabled", false);
user_pref("dom.battery.enabled", false);

# Mobile-optimized new tab page
user_pref("browser.newtabpage.enabled", true);
user_pref("browser.newtabpage.enhanced", true);
user_pref("browser.newtabpage.introShown", true);

# Touch-friendly developer tools
user_pref("devtools.toolbox.host", "bottom");
user_pref("devtools.responsive.metaViewport.enabled", true);
user_pref("devtools.responsive.touchSimulation.enabled", true);

[Mobile_Extensions]
# Recommended extensions for mobile experience
recommended_extensions = [
    "ublock-origin",
    "dark-reader",
    "gesturefy",
    "tab-session-manager",
    "mobile-view-switcher"
]

[CSS_Customizations]
# Custom CSS for mobile-friendly interface
userChrome_css = """
/* Mobile-optimized Firefox interface */
#navigator-toolbox {
    --toolbar-bgcolor: rgba(255, 255, 255, 0.85) !important;
    backdrop-filter: blur(15px) !important;
}

.tabbrowser-tab {
    min-height: 44px !important;
    border-radius: 8px !important;
    margin: 2px !important;
}

#urlbar {
    border-radius: 12px !important;
    min-height: 44px !important;
    backdrop-filter: blur(10px) !important;
    background: rgba(255, 255, 255, 0.9) !important;
}

.toolbarbutton-1 {
    min-width: 44px !important;
    min-height: 44px !important;
    border-radius: 8px !important;
}

#nav-bar {
    padding: 8px !important;
}

/* Mobile-friendly context menus */
menupopup {
    backdrop-filter: blur(15px) !important;
    background: rgba(255, 255, 255, 0.95) !important;
    border-radius: 8px !important;
    box-shadow: 0 4px 8px rgba(0,0,0,0.15) !important;
}

menuitem {
    min-height: 44px !important;
    padding: 8px 16px !important;
}
"""

[Responsive_Design]
# Responsive design testing tools
default_viewport = "375x667" // iPhone SE size
common_viewports = [
    "375x667",   // iPhone SE
    "414x896",   // iPhone 11
    "768x1024",  // iPad
    "1024x768",  // iPad Landscape
    "360x640",   // Android
    "412x732"    // Pixel
]

[Performance]
# Performance settings for mobile hardware
memory_limit = "512MB"
cache_size = "100MB"
max_tabs = 20
preload_pages = 2
lazy_loading = true
image_compression = true
