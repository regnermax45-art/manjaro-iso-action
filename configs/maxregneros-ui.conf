# MaxregnerOS UI Configuration File
# This file defines the comprehensive glassy mobile UI system

[Core]
# UI System Information
name = "MaxregnerOS Glassy Mobile UI"
version = "1.0.0"
description = "Revolutionary glassy mobile-first UI for Linux desktop environments"
author = "MaxregnerOS Team"

[Theme]
# Primary theme configuration
default_theme = "glassy"
available_themes = ["glassy", "crystal", "aurora", "neon"]
theme_path = "/usr/share/maxregneros-ui/themes"
icon_theme = "Papirus"
cursor_theme = "Adwaita"
font_family = "Inter"
font_size = 11

[Mobile]
# Mobile-first optimizations
touch_interface = true
virtual_keyboard = true
gesture_navigation = true
adaptive_layouts = true
screen_rotation = "auto"
touch_feedback = "haptic"
minimum_touch_target = "44px"
swipe_threshold = "100px"
tap_timeout = "300ms"

[Visual_Effects]
# Glassy transparency and effects
transparency = true
blur_effects = true
corner_radius = 12
shadow_depth = 4
animation_speed = "fast"
glassy_opacity = 0.85
blur_radius = 15
fade_duration = 300

[Layout]
# Responsive layout system
responsive_panels = true
adaptive_dock = true
mobile_friendly_menus = true
touch_optimized_controls = true
auto_hide_panels = false
panel_position = "bottom"
dock_autohide_delay = 300

[Gestures]
# Touch gesture configuration
three_finger_swipe_up = "show_desktop"
three_finger_swipe_down = "show_desktop"
three_finger_swipe_left = "next_workspace"
three_finger_swipe_right = "prev_workspace"
four_finger_pinch_in = "show_desktop"
two_finger_scroll = "natural"
edge_swipe_left = "back"
edge_swipe_right = "forward"

[Applications]
# Mobile-optimized application settings
default_browser = "firefox"
default_file_manager = "nautilus"
default_text_editor = "gedit"
default_terminal = "gnome-terminal"
mobile_app_scaling = 1.2
touch_friendly_scrollbars = true
large_buttons = true
simplified_interfaces = true

[Performance]
# Performance optimizations for mobile UI
hardware_acceleration = true
gpu_compositing = true
smooth_animations = true
reduce_motion = false
battery_optimization = true
thermal_management = true

[Accessibility]
# Accessibility features for mobile UI
high_contrast_mode = false
large_text_mode = false
screen_reader_support = true
voice_control = false
magnification = false
color_blind_support = true

[Network]
# Network and connectivity features
wifi_management = "networkmanager"
bluetooth_support = true
mobile_hotspot = true
vpn_support = true
airplane_mode = true

[Security]
# Security features for mobile environment
screen_lock = true
fingerprint_auth = false
face_unlock = false
app_permissions = true
secure_boot = true
encryption = true

[Development]
# Development and debugging options
debug_mode = false
performance_monitoring = false
ui_inspector = false
gesture_debugging = false
theme_hot_reload = false
